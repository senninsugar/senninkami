<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Connection Error</title>
    <style>
        body {
            background: #0f0f0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        h1 { color: #ff3b30; font-size: 3rem; }
        p { color: #888; }
        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #007aff;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Connection Error</h1>
    <p>リクエストされたページに接続できませんでした。</p>
    <a href="/" class="back-btn">ブラウザに戻る</a>
</body>
</html>
