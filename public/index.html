<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>senninproxy v2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --text-color: #ffffff;
            --accent-color: #007aff;
            --input-bg: rgba(255, 255, 255, 0.05);
        }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg-color); color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }
        .container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%; transition: opacity 0.5s ease;
            text-align: center;
        }
        h1 {
            font-weight: 400; font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 30px;
            color: var(--text-color);
        }
        .search-wrapper {
            width: 90%; max-width: 600px;
        }
        .search-bar {
            width: 100%; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 25px; border-radius: 12px; color: white; font-size: 16px;
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .search-bar:focus {
            background: rgba(255, 255, 255, 0.08); border-color: var(--accent-color);
        }
        #frame-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; display: none; z-index: 100;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .back-home {
            position: fixed; bottom: 30px; right: 30px; z-index: 101;
            background: var(--accent-color); color: white; width: 50px; height: 50px;
            border-radius: 50%; display: none; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-ui">
        <h1>senninproxy v2</h1>
        <form class="search-wrapper" id="proxy-form">
            <input type="text" class="search-bar" id="url-input" placeholder="検索またはURLを入力" autocomplete="off">
        </form>
    </div>

    <div id="frame-container">
        <iframe id="proxy-frame"></iframe>
    </div>
    <div class="back-home" id="home-btn" onclick="goHome()"><i class="fas fa-home"></i></div>

    <script>
        const form = document.getElementById('proxy-form');
        const input = document.getElementById('url-input');
        const frameContainer = document.getElementById('frame-container');
        const frame = document.getElementById('proxy-frame');
        const mainUi = document.getElementById('main-ui');
        const homeBtn = document.getElementById('home-btn');

        form.onsubmit = (e) => {
            e.preventDefault();
            let val = input.value.trim();
            if (!val) return;

            let targetUrl = "";
            if (val.includes('.') && !val.includes(' ')) {
                targetUrl = val.startsWith('http') ? val : 'https://' + val;
            } else {
                targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(val);
            }

            mainUi.style.opacity = "0";
            setTimeout(() => {
                mainUi.style.display = "none";
                frameContainer.style.display = "block";
                homeBtn.style.display = "flex";
                frame.src = window.location.origin + '/prefix/' + btoa(targetUrl);
            }, 500);
        };

        function goHome() {
            frame.src = "about:blank";
            frameContainer.style.display = "none";
            homeBtn.style.display = "none";
            mainUi.style.display = "flex";
            setTimeout(() => mainUi.style.opacity = "1", 50);
            input.value = "";
            input.focus();
        }

        window.onload = () => input.focus();
    </script>
</body>
</html>
